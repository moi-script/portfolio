name: Update GitHub contributions

on:
  schedule:
    - cron: '0 16 * * *' # once a day
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fetch-contributions.mjs
      - name: Commit if changed
        run: |
          if git diff --quiet -- public/github-contributions.json; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add public/github-contributions.json
          git commit -m "chore: update GitHub contributions"
          git push
